[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wordcompare"
version = "0.1.0"
description = "Word 文档结构级比较引擎：块对齐 + 行内 diff + 格式 diff，输出 HTML 报告 / 修订 docx / 统计摘要"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1",
    "lxml>=5.0",
    "diff-match-patch>=20230430",
    "jinja2>=3.1",
    "rapidfuzz>=3.0",
]

[project.scripts]
wordcompare = "wordcompare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wordcompare = ["templates/*.j2"]
